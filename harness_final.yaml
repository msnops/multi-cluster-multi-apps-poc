pipeline:
  name: SYS GitOps Bootstrap
  identifier: sys_gitops_bootstrap
  orgIdentifier: FIS_Post_Trade_Processing_Platfor
  projectIdentifier: PTPInfrastructurePrd

  variables:
    - name: gitops_agent_identifier
      type: String
      value: <+input>

  stages:
    - stage:
        name: Deploy
        identifier: Deploy
        type: Deployment

        spec:
          deploymentType: NativeHelm

          service:
            serviceRef: sys_gitops_agent

          environment:
            environmentRef: prd

            infrastructureDefinitions:
              - identifier: eks_ptp_nv_prd_1_infra

          execution:
            steps:

              - step:
                  type: ShellScript
                  name: Prepare GitOps Values
                  identifier: PrepareGitOpsValues
                  timeout: 10m

                  spec:
                    shell: Bash
                    onDelegate: true

                    source:
                      type: Inline

                      spec:
                        script: |
                          set -euo pipefail
                          set +x

                          echo "========================================"
                          echo "Preparing Harness GitOps runtime values"
                          echo "========================================"

                          WORK_DIR="/tmp/gitops-bootstrap-<+pipeline.executionId>"

                          VALUES_FILE="${WORK_DIR}/gitops-runtime-values.yaml"
                          RESPONSE_FILE="${WORK_DIR}/response.json"

                          FILESTORE_BASE_URL="https://app.harness.io/ng/api/file-store"

                          FILESTORE_QUERY="accountIdentifier=<+account.identifier>&orgIdentifier=<+org.identifier>&projectIdentifier=<+project.identifier>"

                          FOLDER_IDENTIFIER="gitops_runtime"
                          FOLDER_NAME="gitops-runtime"

                          FILE_IDENTIFIER="sys_gitops_agent_values"
                          FILE_NAME="sys-gitops-agent-values.yaml"

                          mkdir -p "${WORK_DIR}"
                          chmod 700 "${WORK_DIR}"

                          cleanup() {
                            rm -rf "${WORK_DIR}"
                          }

                          trap cleanup EXIT


                          ################################################
                          # 1. Download deploy.yaml from Harness GitOps
                          ################################################

                          echo
                          echo "Downloading GitOps deployment values..."

                          DOWNLOAD_STATUS="$(
                            curl \
                              --silent \
                              --show-error \
                              --location \
                              --output "${VALUES_FILE}" \
                              --write-out '%{http_code}' \
                              --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>" \
                              "https://app.harness.io/gitops/api/v1/agents/<+pipeline.variables.gitops_agent_identifier>/deploy.yaml?accountIdentifier=<+account.identifier>&orgIdentifier=<+org.identifier>&projectIdentifier=<+project.identifier>&namespace=sys-gitops"
                          )"

                          if [ "${DOWNLOAD_STATUS}" != "200" ]; then
                            echo "ERROR: GitOps values download failed."
                            echo "HTTP status: ${DOWNLOAD_STATUS}"
                            exit 1
                          fi

                          if [ ! -s "${VALUES_FILE}" ]; then
                            echo "ERROR: Downloaded GitOps values file is empty."
                            exit 1
                          fi

                          echo "GitOps values downloaded successfully."


                          ################################################
                          # 2. Append node selector
                          ################################################

                          echo
                          echo "Adding runtime nodeSelector..."

                          cat >> "${VALUES_FILE}" <<'EOF'

                          global:
                            nodeSelector:
                              eks.amazonaws.com/nodegroup: eks-ptp-nv-prd-1-m7i_2cpu_8gb-1c-614edfa6ec0aecb4f85de80cc7
                          EOF

                          echo "Runtime override added."


                          ################################################
                          # 3. Check for gitops-runtime folder
                          ################################################

                          echo
                          echo "Checking Harness File Store folder..."

                          FOLDER_CHECK_STATUS="$(
                            curl \
                              --silent \
                              --show-error \
                              --location \
                              --output "${RESPONSE_FILE}" \
                              --write-out '%{http_code}' \
                              --request GET \
                              "${FILESTORE_BASE_URL}/${FOLDER_IDENTIFIER}?${FILESTORE_QUERY}" \
                              --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>"
                          )"


                          ################################################
                          # 4. Create folder when missing
                          ################################################

                          if [ "${FOLDER_CHECK_STATUS}" = "404" ]; then

                            echo "Creating File Store folder: /gitops-runtime"

                            FOLDER_CREATE_STATUS="$(
                              curl \
                                --silent \
                                --show-error \
                                --location \
                                --output "${RESPONSE_FILE}" \
                                --write-out '%{http_code}' \
                                --request POST \
                                "${FILESTORE_BASE_URL}?${FILESTORE_QUERY}" \
                                --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>" \
                                --form "identifier=${FOLDER_IDENTIFIER}" \
                                --form "name=${FOLDER_NAME}" \
                                --form "type=FOLDER" \
                                --form "parentIdentifier=Root" \
                                --form "description=Runtime GitOps Helm values"
                            )"

                            if [[ "${FOLDER_CREATE_STATUS}" != "200" &&
                                  "${FOLDER_CREATE_STATUS}" != "201" ]]; then

                              echo "ERROR: Failed to create File Store folder."
                              echo "HTTP status: ${FOLDER_CREATE_STATUS}"

                              cat "${RESPONSE_FILE}" || true

                              exit 1
                            fi

                            echo "File Store folder created."

                          elif [ "${FOLDER_CHECK_STATUS}" = "200" ]; then

                            echo "File Store folder already exists."

                          else

                            echo "ERROR: Unable to check File Store folder."
                            echo "HTTP status: ${FOLDER_CHECK_STATUS}"

                            cat "${RESPONSE_FILE}" || true

                            exit 1
                          fi


                          ################################################
                          # 5. Check for values file inside folder
                          ################################################

                          echo
                          echo "Checking runtime values file..."

                          FILE_CHECK_STATUS="$(
                            curl \
                              --silent \
                              --show-error \
                              --location \
                              --output "${RESPONSE_FILE}" \
                              --write-out '%{http_code}' \
                              --request GET \
                              "${FILESTORE_BASE_URL}/${FILE_IDENTIFIER}?${FILESTORE_QUERY}" \
                              --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>"
                          )"


                          ################################################
                          # 6A. Create file when missing
                          ################################################

                          if [ "${FILE_CHECK_STATUS}" = "404" ]; then

                            echo "Creating:"
                            echo "/gitops-runtime/sys-gitops-agent-values.yaml"

                            FILE_STATUS="$(
                              curl \
                                --silent \
                                --show-error \
                                --location \
                                --output "${RESPONSE_FILE}" \
                                --write-out '%{http_code}' \
                                --request POST \
                                "${FILESTORE_BASE_URL}?${FILESTORE_QUERY}" \
                                --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>" \
                                --form "identifier=${FILE_IDENTIFIER}" \
                                --form "name=${FILE_NAME}" \
                                --form "type=FILE" \
                                --form "parentIdentifier=${FOLDER_IDENTIFIER}" \
                                --form "fileUsage=MANIFEST_FILE" \
                                --form "mimeType=application/x-yaml" \
                                --form "description=Runtime Helm values generated by Harness GitOps" \
                                --form "content=@${VALUES_FILE};type=application/x-yaml"
                            )"


                          ################################################
                          # 6B. Update existing file
                          ################################################

                          elif [ "${FILE_CHECK_STATUS}" = "200" ]; then

                            echo "Runtime values file already exists."
                            echo "Updating:"
                            echo "/gitops-runtime/sys-gitops-agent-values.yaml"

                            FILE_STATUS="$(
                              curl \
                                --silent \
                                --show-error \
                                --location \
                                --output "${RESPONSE_FILE}" \
                                --write-out '%{http_code}' \
                                --request PUT \
                                "${FILESTORE_BASE_URL}/${FILE_IDENTIFIER}?${FILESTORE_QUERY}" \
                                --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>" \
                                --form "identifier=${FILE_IDENTIFIER}" \
                                --form "name=${FILE_NAME}" \
                                --form "type=FILE" \
                                --form "parentIdentifier=${FOLDER_IDENTIFIER}" \
                                --form "fileUsage=MANIFEST_FILE" \
                                --form "mimeType=application/x-yaml" \
                                --form "description=Runtime Helm values generated by Harness GitOps" \
                                --form "content=@${VALUES_FILE};type=application/x-yaml"
                            )"

                          else

                            echo "ERROR: Unable to check runtime values file."
                            echo "HTTP status: ${FILE_CHECK_STATUS}"

                            cat "${RESPONSE_FILE}" || true

                            exit 1
                          fi


                          ################################################
                          # 7. Validate create/update
                          ################################################

                          if [[ "${FILE_STATUS}" != "200" &&
                                "${FILE_STATUS}" != "201" &&
                                "${FILE_STATUS}" != "204" ]]; then

                            echo "ERROR: Harness File Store operation failed."
                            echo "HTTP status: ${FILE_STATUS}"

                            cat "${RESPONSE_FILE}" || true

                            exit 1
                          fi

                          echo
                          echo "========================================"
                          echo "Runtime values successfully stored"
                          echo "/gitops-runtime/sys-gitops-agent-values.yaml"
                          echo "========================================"


              ############################################################
              # 8. Managed Helm deployment
              ############################################################

              - step:
                  type: HelmDeploy
                  name: Helm Deploy
                  identifier: HelmDeploy
                  timeout: 15m

                  spec:
                    skipSteadyStateCheck: false


            rollbackSteps:

              - step:
                  type: HelmRollback
                  name: Helm Rollback
                  identifier: HelmRollback
                  timeout: 15m

                  spec:
                    skipSteadyStateCheck: false


        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
