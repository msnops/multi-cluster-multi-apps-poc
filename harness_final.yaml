pipeline:
  name: SYS GitOps Bootstrap
  identifier: sys_gitops_bootstrap
  orgIdentifier: FIS_Post_Trade_Processing_Platfor
  projectIdentifier: PTPInfrastructurePrd

  variables:
    - name: gitops_agent_identifier
      type: String
      value: <+input>

  stages:
    - stage:
        name: Deploy
        identifier: Deploy
        type: Deployment

        spec:
          deploymentType: NativeHelm

          service:
            serviceRef: sys_gitops_agent

          environment:
            environmentRef: prd

            infrastructureDefinitions:
              - identifier: eks_ptp_nv_prd_1_infra

          execution:
            steps:

              - step:
                  type: ShellScript
                  name: Prepare GitOps Values
                  identifier: PrepareGitOpsValues
                  timeout: 10m

                  spec:
                    shell: Bash
                    onDelegate: true

                    source:
                      type: Inline

                      spec:
                        script: |
                          set -euo pipefail
                          set +x

                          WORK_DIR="/tmp/gitops-bootstrap-<+pipeline.executionId>"

                          VALUES_FILE="${WORK_DIR}/gitops-runtime-values.yaml"
                          FILESTORE_PAYLOAD="${WORK_DIR}/filestore-payload.yaml"
                          FILESTORE_RESPONSE="${WORK_DIR}/filestore-response.json"

                          FILESTORE_IDENTIFIER="sys_gitops_agent_runtime_values"
                          FILESTORE_NAME="sys-gitops-agent-runtime-values.yaml"

                          mkdir -p "${WORK_DIR}"
                          chmod 700 "${WORK_DIR}"

                          cleanup() {
                            rm -f \
                              "${VALUES_FILE}" \
                              "${FILESTORE_PAYLOAD}" \
                              "${FILESTORE_RESPONSE}"
                          }

                          trap cleanup EXIT


                          ##################################################
                          # 1. Download deploy.yaml from Harness GitOps
                          ##################################################

                          echo "Downloading Harness GitOps values..."

                          HTTP_STATUS="$(
                            curl \
                              --silent \
                              --show-error \
                              --location \
                              --output "${VALUES_FILE}" \
                              --write-out '%{http_code}' \
                              --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>" \
                              "https://app.harness.io/gitops/api/v1/agents/<+pipeline.variables.gitops_agent_identifier>/deploy.yaml?accountIdentifier=<+account.identifier>&orgIdentifier=<+org.identifier>&projectIdentifier=<+project.identifier>&namespace=sys-gitops"
                          )"

                          if [ "${HTTP_STATUS}" != "200" ]; then
                            echo "ERROR: GitOps values download failed."
                            echo "HTTP status: ${HTTP_STATUS}"
                            exit 1
                          fi

                          if [ ! -s "${VALUES_FILE}" ]; then
                            echo "ERROR: Downloaded GitOps values file is empty."
                            exit 1
                          fi

                          echo "GitOps values downloaded successfully."


                          ##################################################
                          # 2. Add runtime overrides
                          ##################################################

                          cat >> "${VALUES_FILE}" <<'EOF'

                          global:
                            nodeSelector:
                              eks.amazonaws.com/nodegroup: eks-ptp-nv-prd-1-m7i_2cpu_8gb-1c-614edfa6ec0aecb4f85de80cc7
                          EOF

                          echo "Runtime overrides added."


                          ##################################################
                          # 3. Build Harness File Store YAML definition
                          ##################################################

                          {
                            cat <<EOF
                          file:
                            identifier: ${FILESTORE_IDENTIFIER}
                            name: ${FILESTORE_NAME}
                            description: Runtime Helm values generated by Harness GitOps
                            type: FILE
                            parentIdentifier: Root
                            fileUsage: MANIFEST_FILE
                            mimeType: application/x-yaml
                            content: |
                          EOF

                            sed 's/^/      /' "${VALUES_FILE}"

                          } > "${FILESTORE_PAYLOAD}"


                          ##################################################
                          # 4. Upload to Harness File Store
                          ##################################################

                          echo "Uploading runtime values to Harness File Store..."

                          UPLOAD_STATUS="$(
                            curl \
                              --silent \
                              --show-error \
                              --location \
                              --output "${FILESTORE_RESPONSE}" \
                              --write-out '%{http_code}' \
                              --request POST \
                              "https://app.harness.io/ng/api/file-store/yaml?accountIdentifier=<+account.identifier>&orgIdentifier=<+org.identifier>&projectIdentifier=<+project.identifier>" \
                              --header "x-api-key: <+secrets.getValue('org.sys-harness-svc-pat')>" \
                              --header "Content-Type: application/yaml" \
                              --data-binary @"${FILESTORE_PAYLOAD}"
                          )"

                          if [[ "${UPLOAD_STATUS}" != "200" && "${UPLOAD_STATUS}" != "201" ]]; then

                            echo "ERROR: Harness File Store upload failed."
                            echo "HTTP status: ${UPLOAD_STATUS}"

                            if command -v jq >/dev/null 2>&1; then
                              jq -r \
                                '.message // .status // .' \
                                "${FILESTORE_RESPONSE}" \
                                2>/dev/null || true
                            fi

                            exit 1

                          fi

                          echo "Runtime values uploaded successfully."
                          echo "File Store identifier: ${FILESTORE_IDENTIFIER}"

                          #
                          # IMPORTANT:
                          #
                          # Do NOT:
                          #
                          #   cat "${VALUES_FILE}"
                          #   cat "${FILESTORE_PAYLOAD}"
                          #
                          # because the GitOps YAML contains secrets.
                          #


              ############################################################
              # 5. Native Helm deployment
              ############################################################

              - step:
                  type: HelmDeploy
                  name: Helm Deploy
                  identifier: HelmDeploy
                  timeout: 15m

                  spec:
                    skipSteadyStateCheck: false


            ##############################################################
            # Rollback
            ##############################################################

            rollbackSteps:

              - step:
                  type: HelmRollback
                  name: Helm Rollback
                  identifier: HelmRollback
                  timeout: 15m

                  spec:
                    skipSteadyStateCheck: false


        ##################################################################
        # Stage failure strategy
        ##################################################################

        failureStrategies:

          - onFailure:
              errors:
                - AllErrors

              action:
                type: StageRollback
