apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev-cluster01
  namespace: harness-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: harness-gitops
    gitops.harness.io/cluster: dev-cluster01
spec:
  project: default
  source:
    repoURL: https://github.com/msnops/multi-cluster-multi-apps-poc.git
    targetRevision: main
    path: platform/appset
    helm:
      releaseName: root-dev-cluster01
      values: |
        clusterName: dev-cluster01
        repoURL: https://github.com/msnops/multi-cluster-multi-apps-poc.git
        targetRevision: main
        gitopsNamespace: harness-gitops
        applicationSet:
          requeueAfterSeconds: 60
          preserveResourcesOnDeletion: false
  destination:
    server: https://kubernetes.default.svc
    namespace: harness-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
