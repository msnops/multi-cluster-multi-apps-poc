apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ include "cluster-appset.fullname" . }}
  namespace: {{ .Values.gitopsNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "cluster-appset.fullname" . }}
    app.kubernetes.io/part-of: harness-gitops
    gitops.harness.io/cluster: {{ .Values.clusterName | quote }}
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: {{ .Values.applicationSet.preserveResourcesOnDeletion }}
  generators:
    - matrix:
        generators:
          # Child 1 returns exactly one cluster metadata object.
          - git:
              repoURL: {{ .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | quote }}
              requeueAfterSeconds: {{ .Values.applicationSet.requeueAfterSeconds }}
              files:
                - path: clusters/{{ .Values.clusterName }}/cluster.yaml
              pathParamPrefix: clusterConfig
          # Child 2 returns one object for every app selected for this cluster.
          - git:
              repoURL: {{ .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | quote }}
              requeueAfterSeconds: {{ .Values.applicationSet.requeueAfterSeconds }}
              files:
                - path: clusters/{{ .Values.clusterName }}/apps/*.yaml
              pathParamPrefix: appConfig
  template:
    metadata:
      name: '{{`{{ printf "%s-%s" .app.name .cluster.name | normalize }}`}}'
      labels:
        app.kubernetes.io/name: '{{`{{ .app.name | normalize }}`}}'
        app.kubernetes.io/part-of: harness-gitops
        gitops.harness.io/cluster: '{{`{{ .cluster.name }}`}}'
        gitops.harness.io/environment: '{{`{{ .cluster.environment }}`}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{`{{ .cluster.project }}`}}'
      sources:
        # Helm chart source. Values are applied in order; the last file wins.
        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | quote }}
          path: '{{`{{ .app.chartPath }}`}}'
          helm:
            releaseName: '{{`{{ .app.releaseName }}`}}'
            ignoreMissingValueFiles: false
            valueFiles:
              - values.yaml
              - '$values/environments/{{`{{ .cluster.environment }}`}}/values.yaml'
              - '$values/clusters/{{`{{ .cluster.name }}`}}/values/{{`{{ .app.valuesFile }}`}}'
        # The ref exposes the repository root through the $values variable.
        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | quote }}
          ref: values
      destination:
        server: '{{`{{ .cluster.server }}`}}'
        namespace: '{{`{{ .app.namespace }}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
