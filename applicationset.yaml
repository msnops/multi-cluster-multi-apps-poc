apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-agent-{{ .Values.gitopsAgentId }}
  namespace: {{ .Values.gitopsNamespace }}

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  syncPolicy:
    preserveResourcesOnDeletion: {{ .Values.applicationSet.preserveResourcesOnDeletion }}

  generators:
    - matrix:
        generators:

          #
          # CLUSTERS
          #
          - git:
              repoURL: {{ .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | quote }}
              requeueAfterSeconds: {{ .Values.applicationSet.requeueAfterSeconds }}

              files:
                #- path: eks/clusters/*/cluster_values.yaml
                - path: eks_new/clusters/{{ .Values.clusterName }}/cluster_values.yaml

              selector:
                matchLabels:
                  cluster.gitopsAgentId: {{ .Values.gitopsAgentId }}

          #
          # APPS
          #
          - git:
              repoURL: {{ .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | quote }}
              requeueAfterSeconds: {{ .Values.applicationSet.requeueAfterSeconds }}

              files:
{{- $apps := dict }}
{{- range .Values.environmentApps }}
{{- $_ := set $apps . true }}
{{- end }}
{{- range .Values.clusterApps.additional }}
{{- $_ := set $apps . true }}
{{- end }}
{{- range .Values.clusterApps.disabled }}
{{- $_ := unset $apps . }}
{{- end }}
{{- range $app := keys $apps | sortAlpha }}
                - path: eks_new/app-catalog/{{ $app }}.yaml
{{- end }}

  template:
    metadata:
      name: '{{`{{ printf "%s-%s" .app.name .cluster.name | normalize }}`}}'

      labels:
        app.kubernetes.io/name: '{{`{{ .app.name }}`}}'
        gitops.harness.io/cluster: '{{`{{ .cluster.name }}`}}'
        gitops.harness.io/environment: '{{`{{ .cluster.environment }}`}}'
        gitops.harness.io/gitops-agent-id: '{{`{{ .cluster.gitopsAgentId }}`}}'

      finalizers:
        - resources-finalizer.argocd.argoproj.io

    spec:
      project: '{{`{{ .cluster.project }}`}}'

      sources:
        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | quote }}
          path: '{{`{{ .app.chartPath }}`}}'

          helm:
            releaseName: '{{`{{ .app.releaseName }}`}}'

            ignoreMissingValueFiles: true

            valueFiles:
              - values.yaml
              - '$values/eks_new/environments/{{`{{ .cluster.environment }}`}}/values.yaml'
              - '$values/eks_new/clusters/{{`{{ .cluster.name }}`}}/values/{{`{{ .app.valuesFile }}`}}'

        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | quote }}
          ref: values

      destination:
        server: '{{`{{ .cluster.server }}`}}'
        namespace: '{{`{{ .app.namespace }}`}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false

        retry:
          limit: 5

          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true

  templatePatch: |
    spec:
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/preserveUnknownFields
