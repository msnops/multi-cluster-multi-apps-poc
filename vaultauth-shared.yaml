{{- $root := . -}}
{{- range $eksNamespace, $cfg := $root.Values.secretConsumers }}
{{- $shared := $cfg.shared | default dict }}
{{- if and ($cfg.enabled | default false) ($shared.enabled | default false) }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth-shared
  namespace: {{ $eksNamespace | quote }}
  labels:
    app.kubernetes.io/name: vault-secrets-operator
    app.kubernetes.io/component: vault-auth-shared
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  method: jwt
  mount: {{ $shared.authMount | default $root.Values.defaults.authMount | default "jwt" | quote }}
  vaultConnectionRef: {{ $root.Values.vault.connectionRef | default "default" | quote }}
  namespace: {{ printf "%s/%s" $root.Values.vault.namespacePrefix $cfg.shared.vaultNamespace | quote }}
  jwt:
    role: {{ required (printf "secretConsumers.%s.shared.role is required" $eksNamespace) $shared.role | quote }}
    serviceAccount: {{ $root.Values.serviceAccount.name | default "vault-auth" | quote }}
{{- end }}
{{- end }}
