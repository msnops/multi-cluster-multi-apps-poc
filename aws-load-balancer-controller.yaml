aws-load-balancer-controller:
  clusterName: eks-ptp-nv-prd-1

  region: us-east-1

  vpcId: vpc-0b933697ce9d315c3

  enableShield: false
  enableWaf: false
  enableWafv2: false

  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::578254122498:role/eks-ptp-nv-prd-1-aws-lbc

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi

  topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/instance: aws-load-balancer-controller
          app.kubernetes.io/name: aws-load-balancer-controller
      maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
