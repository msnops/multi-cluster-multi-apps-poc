pipeline:
  name: Bootstrap GitOps Agent
  identifier: bootstrap_gitops_agent
  orgIdentifier: default
  projectIdentifier: nonprod
  tags: {}

  variables:
    - name: clusterName
      type: String
      value: <+input>

    - name: environment
      type: String
      value: <+input>

    - name: gitopsAgentId
      type: String
      value: <+input>

    - name: delegateSelector
      type: String
      value: <+input>

    - name: namespace
      type: String
      value: <+input>

    - name: agentSecret
      type: Secret
      value: <+input>

    - name: redisPassword
      type: Secret
      value: <+input>

  stages:
    - stage:
        name: Bootstrap GitOps Agent
        identifier: Bootstrap_GitOps_Agent
        type: Custom

        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Install GitOps Agent
                  identifier: Install_GitOps_Agent
                  timeout: 20m

                  spec:
                    shell: Bash
                    onDelegate: true

                    delegateSelectors:
                      - <+pipeline.variables.delegateSelector>

                    environmentVariables:
                      - name: AGENT_SECRET
                        type: String
                        value: <+pipeline.variables.agentSecret>

                      - name: REDIS_PASSWORD
                        type: String
                        value: <+pipeline.variables.redisPassword>

                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          CLUSTER_NAME="<+pipeline.variables.clusterName>"
                          ENVIRONMENT="<+pipeline.variables.environment>"
                          AGENT_ID="<+pipeline.variables.gitopsAgentId>"
                          NAMESPACE="<+pipeline.variables.namespace>"

                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"

                          REPO_URL="https://github.com/msnops/multi-cluster-multi-apps-poc.git"
                          REPO_BRANCH="main"

                          RELEASE_NAME="argocd"

                          WORKDIR="$(mktemp -d)"

                          cleanup() {
                            rm -rf "${WORKDIR}"
                          }

                          trap cleanup EXIT

                          echo "=========================================="
                          echo "Harness GitOps Agent Bootstrap"
                          echo "=========================================="
                          echo "Cluster      : ${CLUSTER_NAME}"
                          echo "Environment  : ${ENVIRONMENT}"
                          echo "Agent        : ${AGENT_ID}"
                          echo "Namespace    : ${NAMESPACE}"
                          echo "Account      : ${ACCOUNT_ID}"
                          echo "Org          : ${ORG_ID}"
                          echo "Project      : ${PROJECT_ID}"
                          echo "Delegate     : <+pipeline.variables.delegateSelector>"
                          echo "=========================================="

                          echo
                          echo "Checking required tools..."

                          command -v kubectl
                          command -v helm
                          command -v git

                          echo
                          echo "Checking Kubernetes access..."

                          kubectl version
                          kubectl get nodes -o wide

                          echo
                          echo "Cloning GitOps repository from main..."

                          git clone \
                            --depth 1 \
                            --branch "${REPO_BRANCH}" \
                            "${REPO_URL}" \
                            "${WORKDIR}/repo"

                          DEFAULT_VALUES="${WORKDIR}/repo/eks_new/apps/gitops-bootstrap/values.yaml"

                          ENV_VALUES="${WORKDIR}/repo/eks_new/environments/${ENVIRONMENT}/gitops-bootstrap.yaml"

                          CLUSTER_VALUES="${WORKDIR}/repo/eks_new/clusters/${CLUSTER_NAME}/values/gitops-bootstrap.yaml"

                          echo
                          echo "Default values:"
                          echo "${DEFAULT_VALUES}"

                          echo
                          echo "Environment values:"
                          echo "${ENV_VALUES}"

                          echo
                          echo "Cluster values:"
                          echo "${CLUSTER_VALUES}"

                          if [[ ! -f "${DEFAULT_VALUES}" ]]; then
                            echo "ERROR: Default values file does not exist:"
                            echo "${DEFAULT_VALUES}"
                            exit 1
                          fi

                          echo
                          echo "Creating runtime identity values..."

                          cat > "${WORKDIR}/runtime-values.yaml" <<EOF
                          harness:
                            identity:
                              accountIdentifier: "${ACCOUNT_ID}"
                              orgIdentifier: "${ORG_ID}"
                              projectIdentifier: "${PROJECT_ID}"
                              agentIdentifier: "${AGENT_ID}"

                          agent:
                            harnessName: "${CLUSTER_NAME}"
                          EOF

                          echo
                          echo "Preparing secret files..."

                          printf '%s' "${AGENT_SECRET}" \
                            > "${WORKDIR}/agent-secret"

                          printf '%s' "${REDIS_PASSWORD}" \
                            > "${WORKDIR}/redis-password"

                          chmod 600 \
                            "${WORKDIR}/agent-secret" \
                            "${WORKDIR}/redis-password"

                          echo
                          echo "Building Helm values arguments..."

                          HELM_VALUES_ARGS=(
                            -f "${DEFAULT_VALUES}"
                          )

                          if [[ -f "${ENV_VALUES}" ]]; then
                            echo "Using environment override:"
                            echo "${ENV_VALUES}"

                            HELM_VALUES_ARGS+=(
                              -f "${ENV_VALUES}"
                            )
                          else
                            echo "No environment override found."
                          fi

                          if [[ -f "${CLUSTER_VALUES}" ]]; then
                            echo "Using cluster override:"
                            echo "${CLUSTER_VALUES}"

                            HELM_VALUES_ARGS+=(
                              -f "${CLUSTER_VALUES}"
                            )
                          else
                            echo "No cluster-specific override found."
                          fi

                          HELM_VALUES_ARGS+=(
                            -f "${WORKDIR}/runtime-values.yaml"
                          )

                          echo
                          echo "=========================================="
                          echo "Values precedence"
                          echo "=========================================="
                          echo "1. defaults"
                          echo "2. environment override, if present"
                          echo "3. cluster override, if present"
                          echo "4. runtime identity"
                          echo "5. runtime secrets"
                          echo "=========================================="

                          echo
                          echo "Checking important default values..."

                          grep -n -A3 -B2 \
                            'gitopsServerHost' \
                            "${DEFAULT_VALUES}" || true

                          grep -n -A5 -B2 \
                            'agentHttpTarget' \
                            "${DEFAULT_VALUES}" || true

                          echo
                          echo "Adding Harness GitOps Helm repository..."

                          helm repo add gitops-agent \
                            https://harness.github.io/gitops-helm/ \
                            --force-update

                          helm repo update gitops-agent

                          echo
                          echo "Rendering Helm manifest for validation..."

                          helm template "${RELEASE_NAME}" \
                            gitops-agent/gitops-helm \
                            --namespace "${NAMESPACE}" \
                            "${HELM_VALUES_ARGS[@]}" \
                            --set-file harness.secrets.agentSecret="${WORKDIR}/agent-secret" \
                            --set-file harness.secrets.redisPassword="${WORKDIR}/redis-password" \
                            > "${WORKDIR}/rendered.yaml"

                          echo
                          echo "Checking rendered GitOps Agent target..."

                          grep -n -A3 -B3 \
                            'AGENT_HTTP_TARGET' \
                            "${WORKDIR}/rendered.yaml" || true

                          echo
                          echo "Checking rendered agent image..."

                          grep -n -A5 -B3 \
                            'harness/gitops-agent' \
                            "${WORKDIR}/rendered.yaml" || true

                          echo
                          echo "Helm rendering completed successfully."

                          echo
                          echo "Installing/upgrading Harness GitOps Agent..."

                          helm upgrade --install "${RELEASE_NAME}" \
                            gitops-agent/gitops-helm \
                            --namespace "${NAMESPACE}" \
                            --create-namespace \
                            "${HELM_VALUES_ARGS[@]}" \
                            --set-file harness.secrets.agentSecret="${WORKDIR}/agent-secret" \
                            --set-file harness.secrets.redisPassword="${WORKDIR}/redis-password" \
                            --wait \
                            --timeout 15m

                          echo
                          echo "=========================================="
                          echo "Helm release"
                          echo "=========================================="

                          helm list \
                            --namespace "${NAMESPACE}"

                          echo
                          echo "=========================================="
                          echo "Effective values"
                          echo "=========================================="

                          helm get values "${RELEASE_NAME}" \
                            --namespace "${NAMESPACE}"

                          echo
                          echo "=========================================="
                          echo "GitOps Agent ConfigMap"
                          echo "=========================================="

                          kubectl get configmap gitops-agent \
                            --namespace "${NAMESPACE}" \
                            -o yaml || true

                          echo
                          echo "=========================================="
                          echo "Pods"
                          echo "=========================================="

                          kubectl get pods \
                            --namespace "${NAMESPACE}" \
                            -o wide

                          echo
                          echo "=========================================="
                          echo "Deployments"
                          echo "=========================================="

                          kubectl get deployments \
                            --namespace "${NAMESPACE}"

                          echo
                          echo "=========================================="
                          echo "GitOps Agent bootstrap completed"
                          echo "=========================================="

                    outputVariables: []