pipeline:
  name: Bootstrap GitOps Agent
  identifier: bootstrap_gitops_agent
  orgIdentifier: default
  projectIdentifier: default_project
  tags: {}

  variables:
    - name: clusterName
      type: String
      value: <+input>

    - name: environment
      type: String
      value: <+input>

    - name: gitopsAgentId
      type: String
      value: <+input>

    - name: delegateSelector
      type: String
      value: <+input>

    - name: namespace
      type: String
      value: <+input>

    - name: agentSecret
      type: Secret
      value: <+input>

    - name: redisPassword
      type: Secret
      value: <+input>

  stages:
    - stage:
        name: Bootstrap GitOps Agent
        identifier: Bootstrap_GitOps_Agent
        type: Custom

        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Install GitOps Agent
                  identifier: Install_GitOps_Agent
                  timeout: 20m

                  spec:
                    shell: Bash
                    onDelegate: true

                    delegateSelectors:
                      - <+pipeline.variables.delegateSelector>

                    environmentVariables:
                      - name: AGENT_SECRET
                        type: String
                        value: <+pipeline.variables.agentSecret>

                      - name: REDIS_PASSWORD
                        type: String
                        value: <+pipeline.variables.redisPassword>

                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          CLUSTER_NAME="<+pipeline.variables.clusterName>"
                          ENVIRONMENT="<+pipeline.variables.environment>"
                          AGENT_ID="<+pipeline.variables.gitopsAgentId>"
                          NAMESPACE="<+pipeline.variables.namespace>"

                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"

                          REPO_URL="https://github.com/msnops/multi-cluster-multi-apps-poc.git"
                          REPO_BRANCH="main"

                          RELEASE_NAME="argocd"
                          CHART_NAME="gitops-agent/gitops-helm"
                          CHART_VERSION="1.2.8"

                          WORKDIR="$(mktemp -d)"

                          cleanup() {
                            rm -rf "${WORKDIR}"
                          }

                          trap cleanup EXIT

                          echo "=========================================="
                          echo "Harness GitOps Agent Bootstrap"
                          echo "=========================================="
                          echo "Cluster       : ${CLUSTER_NAME}"
                          echo "Environment   : ${ENVIRONMENT}"
                          echo "Agent         : ${AGENT_ID}"
                          echo "Namespace     : ${NAMESPACE}"
                          echo "Account       : ${ACCOUNT_ID}"
                          echo "Org           : ${ORG_ID}"
                          echo "Project       : ${PROJECT_ID}"
                          echo "Delegate      : <+pipeline.variables.delegateSelector>"
                          echo "Chart         : ${CHART_NAME}"
                          echo "Chart Version : ${CHART_VERSION}"
                          echo "Git Branch    : ${REPO_BRANCH}"
                          echo "=========================================="

                          echo
                          echo "Checking required tools..."

                          command -v kubectl
                          command -v helm
                          command -v git

                          echo
                          echo "Tool versions..."

                          kubectl version || true
                          helm version
                          git --version

                          echo
                          echo "Checking Kubernetes access..."

                          kubectl get nodes -o wide

                          echo
                          echo "Cloning GitOps repository from main..."

                          git clone \
                            --depth 1 \
                            --branch "${REPO_BRANCH}" \
                            "${REPO_URL}" \
                            "${WORKDIR}/repo"

                          DEFAULT_VALUES="${WORKDIR}/repo/eks_new/apps/gitops-bootstrap/values.yaml"

                          ENV_VALUES="${WORKDIR}/repo/eks_new/environments/${ENVIRONMENT}/gitops-bootstrap.yaml"

                          CLUSTER_VALUES="${WORKDIR}/repo/eks_new/clusters/${CLUSTER_NAME}/values/gitops-bootstrap.yaml"

                          echo
                          echo "=========================================="
                          echo "VALUES FILE LOCATIONS"
                          echo "=========================================="
                          echo "Default     : ${DEFAULT_VALUES}"
                          echo "Environment : ${ENV_VALUES}"
                          echo "Cluster     : ${CLUSTER_VALUES}"
                          echo "=========================================="

                          if [[ ! -f "${DEFAULT_VALUES}" ]]; then
                            echo
                            echo "ERROR: Default values file does not exist:"
                            echo "${DEFAULT_VALUES}"
                            exit 1
                          fi

                          echo
                          echo "=========================================="
                          echo "VERIFYING DEFAULT VALUES"
                          echo "=========================================="

                          ls -l "${DEFAULT_VALUES}"

                          echo
                          echo "gitopsServerHost:"
                          grep -n -A2 -B2 \
                            'gitopsServerHost' \
                            "${DEFAULT_VALUES}" || true

                          echo
                          echo "agentHttpTarget:"
                          grep -n -A4 -B2 \
                            'agentHttpTarget' \
                            "${DEFAULT_VALUES}" || true

                          echo
                          echo "appsetReconcile:"
                          grep -n -A2 -B2 \
                            'appsetReconcile' \
                            "${DEFAULT_VALUES}" || true

                          echo
                          echo "Configured GitOps Agent image:"
                          grep -n -A4 -B4 \
                            'v0.124.0' \
                            "${DEFAULT_VALUES}" || true

                          echo
                          echo "=========================================="
                          echo "CREATING RUNTIME IDENTITY VALUES"
                          echo "=========================================="

                          cat > "${WORKDIR}/runtime-values.yaml" <<EOF
                          harness:
                            identity:
                              accountIdentifier: "${ACCOUNT_ID}"
                              orgIdentifier: "${ORG_ID}"
                              projectIdentifier: "${PROJECT_ID}"
                              agentIdentifier: "${AGENT_ID}"

                          agent:
                            harnessName: "${CLUSTER_NAME}"
                          EOF

                          cat "${WORKDIR}/runtime-values.yaml"

                          echo
                          echo "=========================================="
                          echo "PREPARING SECRETS"
                          echo "=========================================="

                          printf '%s' "${AGENT_SECRET}" \
                            > "${WORKDIR}/agent-secret"

                          printf '%s' "${REDIS_PASSWORD}" \
                            > "${WORKDIR}/redis-password"

                          chmod 600 \
                            "${WORKDIR}/agent-secret" \
                            "${WORKDIR}/redis-password"

                          echo "Agent secret file created."
                          echo "Redis password file created."

                          echo
                          echo "=========================================="
                          echo "BUILDING HELM VALUES PRECEDENCE"
                          echo "=========================================="

                          HELM_VALUES_ARGS=(
                            -f "${DEFAULT_VALUES}"
                          )

                          echo "1. defaults:"
                          echo "   ${DEFAULT_VALUES}"

                          if [[ -f "${ENV_VALUES}" ]]; then
                            HELM_VALUES_ARGS+=(
                              -f "${ENV_VALUES}"
                            )

                            echo "2. environment override:"
                            echo "   ${ENV_VALUES}"
                          else
                            echo "2. environment override: not found, skipping"
                          fi

                          if [[ -f "${CLUSTER_VALUES}" ]]; then
                            HELM_VALUES_ARGS+=(
                              -f "${CLUSTER_VALUES}"
                            )

                            echo "3. cluster override:"
                            echo "   ${CLUSTER_VALUES}"
                          else
                            echo "3. cluster override: not found, skipping"
                          fi

                          HELM_VALUES_ARGS+=(
                            -f "${WORKDIR}/runtime-values.yaml"
                          )

                          echo "4. runtime identity:"
                          echo "   ${WORKDIR}/runtime-values.yaml"

                          echo "5. runtime secrets:"
                          echo "   supplied with --set-file"

                          echo
                          echo "=========================================="
                          echo "ENVIRONMENT OVERRIDE CONTENT"
                          echo "=========================================="

                          if [[ -f "${ENV_VALUES}" ]]; then
                            cat "${ENV_VALUES}"
                          else
                            echo "No environment override."
                          fi

                          echo
                          echo "=========================================="
                          echo "CLUSTER OVERRIDE CONTENT"
                          echo "=========================================="

                          if [[ -f "${CLUSTER_VALUES}" ]]; then
                            cat "${CLUSTER_VALUES}"
                          else
                            echo "No cluster override."
                          fi

                          echo
                          echo "=========================================="
                          echo "ADDING HARNESS HELM REPOSITORY"
                          echo "=========================================="

                          helm repo add gitops-agent \
                            https://harness.github.io/gitops-helm/ \
                            --force-update

                          helm repo update gitops-agent

                          echo
                          echo "=========================================="
                          echo "VERIFYING CHART"
                          echo "=========================================="

                          helm show chart "${CHART_NAME}" \
                            --version "${CHART_VERSION}"

                          echo
                          echo "=========================================="
                          echo "RENDERING EFFECTIVE HELM MANIFEST"
                          echo "=========================================="

                          helm template "${RELEASE_NAME}" \
                            "${CHART_NAME}" \
                            --version "${CHART_VERSION}" \
                            --namespace "${NAMESPACE}" \
                            "${HELM_VALUES_ARGS[@]}" \
                            --set-file harness.secrets.agentSecret="${WORKDIR}/agent-secret" \
                            --set-file harness.secrets.redisPassword="${WORKDIR}/redis-password" \
                            > "${WORKDIR}/rendered.yaml"

                          echo
                          echo "=========================================="
                          echo "RENDERED AGENT_HTTP_TARGET"
                          echo "=========================================="

                          grep -n -A3 -B3 \
                            'AGENT_HTTP_TARGET' \
                            "${WORKDIR}/rendered.yaml" || true

                          echo
                          echo "=========================================="
                          echo "RENDERED APPSET RECONCILE"
                          echo "=========================================="

                          grep -n -A3 -B3 \
                            'GITOPS_AGENT_APPSET_RECONCILE_ENABLE' \
                            "${WORKDIR}/rendered.yaml" || true

                          echo
                          echo "=========================================="
                          echo "RENDERED GITOPS AGENT IMAGE"
                          echo "=========================================="

                          grep -n -A4 -B4 \
                            'harness/gitops-agent' \
                            "${WORKDIR}/rendered.yaml" \
                            | head -30 || true

                          echo
                          echo "=========================================="
                          echo "VALIDATING AGENT_HTTP_TARGET"
                          echo "=========================================="

                          if ! grep -q 'AGENT_HTTP_TARGET.*https://app.harness.io' \
                            "${WORKDIR}/rendered.yaml"; then

                            echo
                            echo "ERROR:"
                            echo "AGENT_HTTP_TARGET was not rendered with the Harness SaaS URL."
                            echo
                            echo "Stopping before Helm installation."
                            exit 1
                          fi

                          echo "AGENT_HTTP_TARGET validation passed."

                          echo
                          echo "=========================================="
                          echo "INSTALLING / UPGRADING GITOPS AGENT"
                          echo "=========================================="

                          helm upgrade --install "${RELEASE_NAME}" \
                            "${CHART_NAME}" \
                            --version "${CHART_VERSION}" \
                            --namespace "${NAMESPACE}" \
                            --create-namespace \
                            "${HELM_VALUES_ARGS[@]}" \
                            --set-file harness.secrets.agentSecret="${WORKDIR}/agent-secret" \
                            --set-file harness.secrets.redisPassword="${WORKDIR}/redis-password" \
                            --set argo-cd.crds.install=false \
                            --wait \
                            --timeout 15m

                          echo
                          echo "=========================================="
                          echo "HELM RELEASE"
                          echo "=========================================="

                          helm list \
                            --namespace "${NAMESPACE}"

                          echo
                          echo "=========================================="
                          echo "HELM EFFECTIVE USER VALUES"
                          echo "=========================================="

                          helm get values "${RELEASE_NAME}" \
                            --namespace "${NAMESPACE}"

                          echo
                          echo "=========================================="
                          echo "DEPLOYED AGENT CONFIG"
                          echo "=========================================="

                          kubectl get configmap gitops-agent \
                            --namespace "${NAMESPACE}" \
                            -o jsonpath='Account={.data.GITOPS_ACCOUNT_IDENTIFIER}{"\n"}Org={.data.GITOPS_ORG_IDENTIFIER}{"\n"}Project={.data.GITOPS_PROJECT_IDENTIFIER}{"\n"}Agent={.data.GITOPS_AGENT_IDENTIFIER}{"\n"}HTTP_Target={.data.AGENT_HTTP_TARGET}{"\n"}AppSet_Reconcile={.data.GITOPS_AGENT_APPSET_RECONCILE_ENABLE}{"\n"}'

                          echo
                          echo "=========================================="
                          echo "DEPLOYED AGENT IMAGE"
                          echo "=========================================="

                          kubectl get deployment gitops-agent \
                            --namespace "${NAMESPACE}" \
                            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

                          echo
                          echo "=========================================="
                          echo "PODS"
                          echo "=========================================="

                          kubectl get pods \
                            --namespace "${NAMESPACE}" \
                            -o wide

                          echo
                          echo "=========================================="
                          echo "DEPLOYMENTS"
                          echo "=========================================="

                          kubectl get deployments \
                            --namespace "${NAMESPACE}"

                          echo
                          echo "=========================================="
                          echo "GITOPS AGENT LOGS"
                          echo "=========================================="

                          kubectl logs \
                            --namespace "${NAMESPACE}" \
                            deployment/gitops-agent \
                            --tail=50 || true

                          echo
                          echo "=========================================="
                          echo "GitOps Agent bootstrap completed"
                          echo "=========================================="

                    outputVariables: []