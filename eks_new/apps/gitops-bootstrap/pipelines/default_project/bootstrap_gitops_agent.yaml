pipeline:
  name: Bootstrap GitOps Agent
  identifier: bootstrap_gitops_agent
  orgIdentifier: default
  projectIdentifier: default_project
  tags: {}

  variables:
    - name: clusterName
      type: String
      value: <+input>

    - name: environment
      type: String
      value: <+input>

    - name: gitopsAgentId
      type: String
      value: <+input>

    - name: delegateSelector
      type: String
      value: <+input>

    - name: namespace
      type: String
      value: <+input>

    - name: agentSecret
      type: Secret
      value: <+input>

    - name: redisPassword
      type: Secret
      value: <+input>

  stages:
    - stage:
        name: Bootstrap GitOps Agent
        identifier: Bootstrap_GitOps_Agent
        type: Custom

        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Install GitOps Agent
                  identifier: Install_GitOps_Agent
                  timeout: 20m

                  spec:
                    shell: Bash
                    onDelegate: true

                    delegateSelectors:
                      - <+pipeline.variables.delegateSelector>

                    environmentVariables:
                      - name: AGENT_SECRET
                        type: String
                        value: <+pipeline.variables.agentSecret>

                      - name: REDIS_PASSWORD
                        type: String
                        value: <+pipeline.variables.redisPassword>

                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          CLUSTER_NAME="<+pipeline.variables.clusterName>"
                          ENVIRONMENT="<+pipeline.variables.environment>"
                          AGENT_ID="<+pipeline.variables.gitopsAgentId>"
                          NAMESPACE="<+pipeline.variables.namespace>"

                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"

                          REPO_URL="https://github.com/msnops/multi-cluster-multi-apps-poc.git"
                          REPO_BRANCH="main"

                          WORKDIR="$(mktemp -d)"

                          cleanup() {
                            rm -rf "${WORKDIR}"
                          }

                          trap cleanup EXIT

                          echo "=========================================="
                          echo "Harness GitOps Agent Bootstrap"
                          echo "=========================================="
                          echo "Cluster      : ${CLUSTER_NAME}"
                          echo "Environment  : ${ENVIRONMENT}"
                          echo "Agent        : ${AGENT_ID}"
                          echo "Namespace    : ${NAMESPACE}"
                          echo "Account      : ${ACCOUNT_ID}"
                          echo "Org          : ${ORG_ID}"
                          echo "Project      : ${PROJECT_ID}"
                          echo "Delegate     : <+pipeline.variables.delegateSelector>"
                          echo "=========================================="

                          command -v kubectl
                          command -v helm
                          command -v git

                          kubectl version
                          kubectl get nodes -o wide

                          echo
                          echo "Cloning GitOps repository from main..."

                          git clone \
                            --depth 1 \
                            --branch "${REPO_BRANCH}" \
                            "${REPO_URL}" \
                            "${WORKDIR}/repo"

                          DEFAULT_VALUES="${WORKDIR}/repo/eks_new/apps/gitops-bootstrap/values.yaml"

                          ENV_VALUES="${WORKDIR}/repo/eks_new/environments/${ENVIRONMENT}/gitops-bootstrap.yaml"

                          CLUSTER_VALUES="${WORKDIR}/repo/eks_new/clusters/${CLUSTER_NAME}/values/gitops-bootstrap.yaml"

                          echo
                          echo "Default values: ${DEFAULT_VALUES}"
                          echo "Environment values: ${ENV_VALUES}"
                          echo "Cluster values: ${CLUSTER_VALUES}"

                          if [[ ! -f "${DEFAULT_VALUES}" ]]; then
                            echo "ERROR: Default values file not found:"
                            echo "${DEFAULT_VALUES}"
                            exit 1
                          fi

                          if [[ ! -f "${ENV_VALUES}" ]]; then
                            echo "Environment override not found. Using empty values."
                            echo "{}" > "${WORKDIR}/empty-environment.yaml"
                            ENV_VALUES="${WORKDIR}/empty-environment.yaml"
                          fi

                          if [[ ! -f "${CLUSTER_VALUES}" ]]; then
                            echo "Cluster override not found. Using empty values."
                            echo "{}" > "${WORKDIR}/empty-cluster.yaml"
                            CLUSTER_VALUES="${WORKDIR}/empty-cluster.yaml"
                          fi

                          echo
                          echo "Creating runtime identity values..."

                          cat > "${WORKDIR}/runtime-values.yaml" <<EOF
                          harness:
                            identity:
                              accountIdentifier: "${ACCOUNT_ID}"
                              orgIdentifier: "${ORG_ID}"
                              projectIdentifier: "${PROJECT_ID}"
                              agentIdentifier: "${AGENT_ID}"

                          agent:
                            harnessName: "${CLUSTER_NAME}"
                          EOF

                          echo
                          echo "Preparing secret files..."

                          printf '%s' "${AGENT_SECRET}" \
                            > "${WORKDIR}/agent-secret"

                          printf '%s' "${REDIS_PASSWORD}" \
                            > "${WORKDIR}/redis-password"

                          chmod 600 \
                            "${WORKDIR}/agent-secret" \
                            "${WORKDIR}/redis-password"

                          echo
                          echo "Adding Harness GitOps Helm repository..."

                          helm repo add argocd \
                            https://harness.github.io/gitops-helm/ \
                            --force-update

                          helm repo update argocd

                          echo
                          echo "Validating Helm rendering..."

                          helm template argocd \
                            argocd/gitops-helm \
                            --namespace "${NAMESPACE}" \
                            -f "${DEFAULT_VALUES}" \
                            -f "${ENV_VALUES}" \
                            -f "${CLUSTER_VALUES}" \
                            -f "${WORKDIR}/runtime-values.yaml" \
                            --set-file harness.secrets.agentSecret="${WORKDIR}/agent-secret" \
                            --set-file harness.secrets.redisPassword="${WORKDIR}/redis-password" \
                            > /dev/null

                          echo
                          echo "Helm rendering successful."

                          echo
                          echo "Installing/upgrading Harness GitOps Agent..."

                          helm upgrade --install argocd \
                            argocd/gitops-helm \
                            --namespace "${NAMESPACE}" \
                            --create-namespace \
                            -f "${DEFAULT_VALUES}" \
                            -f "${ENV_VALUES}" \
                            -f "${CLUSTER_VALUES}" \
                            -f "${WORKDIR}/runtime-values.yaml" \
                            --set-file harness.secrets.agentSecret="${WORKDIR}/agent-secret" \
                            --set-file harness.secrets.redisPassword="${WORKDIR}/redis-password" \
                            --wait \
                            --timeout 15m

                          echo
                          echo "=========================================="
                          echo "Helm release"
                          echo "=========================================="

                          helm list -n "${NAMESPACE}"

                          echo
                          echo "=========================================="
                          echo "Pods"
                          echo "=========================================="

                          kubectl get pods \
                            -n "${NAMESPACE}" \
                            -o wide

                          echo
                          echo "=========================================="
                          echo "Deployments"
                          echo "=========================================="

                          kubectl get deployments \
                            -n "${NAMESPACE}"

                          echo
                          echo "GitOps Agent bootstrap completed successfully."

                    outputVariables: []