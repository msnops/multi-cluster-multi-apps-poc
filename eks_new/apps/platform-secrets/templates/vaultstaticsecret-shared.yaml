{{- $root := . -}}
{{- range $eksNamespace, $cfg := $root.Values.secretConsumers }}
{{- with $cfg.shared }}
{{- range $secret := (.secrets | default list) }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secret.name | quote }}
  namespace: {{ $eksNamespace | quote }}
  labels:
    app.kubernetes.io/name: platform-secrets
    app.kubernetes.io/component: vault-static-secret-shared
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: {{ $secret.secretType | default $root.Values.defaults.secretType | default "kv-v2" | quote }}
  mount: {{ required (printf "secretConsumers.%s.shared.secrets[].mount is required for %s" $eksNamespace $secret.name) $secret.mount | quote }}
  path: {{ required (printf "secretConsumers.%s.shared.secrets[].path is required for %s" $eksNamespace $secret.name) $secret.path | quote }}
  vaultAuthRef: {{ $secret.vaultAuthRef | default "vault-auth-shared" | quote }}
  refreshAfter: {{ $secret.refreshAfter | default $root.Values.defaults.refreshAfter | default "30s" | quote }}
  destination:
    create: {{ $secret.create | default true }}
    overwrite: {{ $secret.overwrite | default true }}
    name: {{ $secret.destinationName | default $secret.name | quote }}
    {{- if $secret.destinationType }}
    type: {{ $secret.destinationType | quote }}
    {{- end }}
    {{- with $secret.transformation }}
    transformation:
      {{- if hasKey . "excludeRaw" }}
      excludeRaw: {{ .excludeRaw }}
      {{- end }}
      {{- with .excludes }}
      excludes:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .includes }}
      includes:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .templates }}
      templates:
        {{- range $templateName, $template := . }}
        {{ $templateName | quote }}:
          text: |
{{ $template.text | indent 12 }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
