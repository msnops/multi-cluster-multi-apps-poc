cluster:
  name: eks-ptp-nv-prd-1

vault:
  connectionRef: default

secretConsumers:
  dwlprd1:
    own:
      secrets:
        - name: app-db-secret
          mount: kv
          path: app/db

    shared:
      secrets:
        - name: artifactory-regcred
          mount: kv
          path: artifactory/svcacct-ptp-caas-snapshot
          destinationType: kubernetes.io/dockerconfigjson

  nginx-ingress:
    shared:
      secrets:
        - name: artifactory-regcred
          mount: kv
          path: artifactory/svcacct-ptp-caas-snapshot
          destinationType: kubernetes.io/dockerconfigjson
        - name: nginx-default-tls
          mount: kv
          path: certs/nginx-default-tls
          destinationName: nginx-default-tls
          destinationType: kubernetes.io/tls
