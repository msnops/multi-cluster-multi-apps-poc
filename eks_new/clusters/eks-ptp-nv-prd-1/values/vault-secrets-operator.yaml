cluster:
  name: eks-ptp-nv-prd-1

vault:
  address: https://hcv.fiscloudservices.com
  connectionRef: default

serviceAccount:
  name: vault-auth

defaults:
  authMount: eks-ptp-nv-prd-1
  sharedVaultNamespace: multi_client

secretConsumers:
  dwlprd1:
    enabled: true
    own:
      enabled: true
      vaultNamespace: dwlprd1
      role: eks-ptp-nv-prd-1-dwlprd1

    shared:
      enabled: true
      vaultNamespace: multi_client
      role: dwlprd1-role

  nginx-ingress:
    enabled: true

    shared:
      enabled: true
      vaultNamespace: multi_client
      role: nginx-ingress-role
