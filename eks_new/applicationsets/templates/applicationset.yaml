apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-agent-{{ required "gitopsAgentId is required" .Values.gitopsAgentId | lower | replace "_" "-" }}
  namespace: {{ required "gitopsNamespace is required" .Values.gitopsNamespace }}
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  syncPolicy:
    preserveResourcesOnDeletion: {{ .Values.preserveResourcesOnDeletion | default false }}

  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["waven5"]
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["waven4"]
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["waven3"]
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["waven2"]
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["waven1"]
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["wave0"]
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["wave1"]
        - matchExpressions:
            - key: syncWave
              operator: In
              values: ["wave2"]
        - matchExpressions:
            - key: syncWave
              operator: Exists

  generators:
    - matrix:
        generators:
          # Cluster config generator
          - git:
              repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | default "main" | quote }}
              requeueAfterSeconds: {{ .Values.requeueAfterSeconds | default 60 }}
              files:
                - path: eks_new/clusters/{{ required "clusterName is required" .Values.clusterName }}/cluster.yaml

          # Apps generator - with proper filtering at generation time
          - git:
              repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | default "main" | quote }}
              requeueAfterSeconds: {{ .Values.requeueAfterSeconds | default 60 }}
              files:
                - path: 'eks_new/app-catalog/*.yaml'
              template:
                goTemplate: true
                metadata:
                  labels:
                    appset.harness.io/filtered: "true"
                spec:
                  # Filtering logic to exclude disabled apps
                  {{`{{- $appName := .app.name }}
                  {{- $enabledApps := default (list) .cluster.enabledApps }}
                  {{- $disabledApps := default (list) .cluster.disabledApps }}
                  {{- $isEnabled := has $appName $enabledApps }}
                  {{- $isDisabled := has $appName $disabledApps }}
                  {{- if and $isEnabled (not $isDisabled) }}
                  parameters:
                    - name: appName
                      value: {{ $appName }}
                  {{- end }}`}}

  template:
    metadata:
      name: '{{`{{ printf "%s-%s" .app.name .cluster.name | normalize }}`}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{`{{ default "0" .app.syncWave }}`}}'
      labels:
        app.kubernetes.io/name: '{{`{{ .app.name }}`}}'
        gitops.harness.io/cluster: '{{`{{ .cluster.name }}`}}'
        gitops.harness.io/environment: '{{`{{ .cluster.environment }}`}}'
        gitops.harness.io/gitops-agent-id: '{{`{{ .cluster.gitopsAgentId }}`}}'
        syncWave: '{{`{{ printf "wave%s" (default "0" .app.syncWave | replace "-" "n") }}`}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io

    spec:
      project: '{{`{{ .cluster.project }}`}}'

      sources:
        - repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | default "main" | quote }}
          path: '{{`{{ .app.chartPath }}`}}'
          helm:
            releaseName: '{{`{{ .app.releaseName }}`}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - values.yaml
              - '$values/eks_new/environments/{{`{{ .cluster.environment }}`}}/values/{{`{{ .app.name }}`}}.yaml'
              - '$values/eks_new/clusters/{{`{{ .cluster.name }}`}}/values/{{`{{ .app.name }}`}}.yaml'

        - repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | default "main" | quote }}
          ref: values

      destination:
        server: '{{`{{ .cluster.server }}`}}'
        namespace: '{{`{{ .app.namespace }}`}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
